<header>
    <div class="topbar-context">
        <button type="button" class="secondary menu-toggle" aria-controls="app-sidebar" aria-expanded="false"><span aria-hidden="true">☰</span> Menu</button>
        <span class="topbar-title">{{ title or 'SecureAccess Privacy' }}</span>
    </div>
    <div class="topbar-account">
        {% include 'components/theme_picker.html' %}
        <a class="profile" href="{{ url_for('admin.permissions') if current_user.role == 'admin' else url_for('user.data') }}">
            <span class="avatar" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 21v-2a8 8 0 0 1 16 0v2" stroke-linecap="round"/>
                </svg>
                {% if current_user.profile and current_user.profile.photo %}
                    <img src="{{ url_for('user.profile_photo') }}" alt="" width="40" height="40" data-navbar-avatar>
                {% endif %}
            </span>
            <span class="profile-text">
                <span class="profile-name" title="{{ current_user.username }}">{{ current_user.username }}</span>
                <small>{{ 'Administrador' if current_user.role == 'admin' else 'Utilizador' }}</small>
            </span>
        </a>
        <form class="logout-form" method="post" action="{{ url_for('auth.logout') }}">{{ csrf() }}<button class="secondary">Sair</button></form>
    </div>
</header>
