<div class="cards">
    {% for label,value,description,endpoint in cards %}
        <a class="card metric" href="{{ url_for(endpoint) }}">
        <span class="metric-icon" aria-hidden="true">{{ ['◇','◷','▤','↓'][loop.index0] }}</span>
        <div>
        <h2>{{ label }}</h2>
        <strong>{{ value }}</strong>
        <p>{{ description }}</p>
        </div>
        <span aria-hidden="true">›</span>
        </a>
    {% endfor %}
    </div>
    <section class="card">
    <div class="section-heading">
    <h2>Atividade recente</h2>
    <a href="{{ url_for('admin.logs') if administrative else url_for('user.history') }}">Ver tudo →</a>
    </div>
    {% include 'components/log_table.html' %}
    </section>
